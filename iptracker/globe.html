<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>IP Tracker — approximate location</title>
<script>window.CESIUM_BASE_URL='https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/';</script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#0c1424;color:#edf2ff;font-family:system-ui,sans-serif}
#globe{position:absolute;inset:0;border-radius:14px;overflow:hidden}
.tools{position:absolute;left:14px;top:14px;display:flex;gap:7px;flex-wrap:wrap;max-width:75%;z-index:2}
button{padding:9px 13px;background:#162238eF;color:#edf2ff;border:1px solid #6b82b2;border-radius:8px;cursor:pointer}
button:hover{background:#334973}button:focus-visible{outline:3px solid #9cacff}
.note{position:absolute;bottom:32px;left:14px;right:14px;background:#0c1424d9;padding:9px 12px;border-radius:8px;font-size:12px;pointer-events:none;z-index:2}
#status{position:absolute;top:65px;left:14px;right:14px;z-index:3;background:#162238ed;padding:12px;border-radius:8px;font-size:13px}
.cesium-viewer-bottom{background:#0c1424bb}
</style>
</head>
<body>
<div id="globe" aria-label="Interactive 3D globe showing approximate IP location"></div>
<div class="tools"><button id="recenter">Recenter</button><button id="world">Globe view</button><button id="flat">2D / 3D</button></div>
<div id="status" role="status">Loading 3D globe…</div>
<div class="note">Approximate IP location · Not GPS or a street address.<br>Drag to move · Scroll to zoom · Ctrl + drag to tilt / rotate</div>
<script>
const locationData=__COORDINATES__;
const statusBox=document.getElementById('status');
function showError(text){statusBox.textContent=text;statusBox.style.display='block';}
function boot(){
  try{
    Cesium.Ion.defaultAccessToken='';
    const osm=new Cesium.OpenStreetMapImageryProvider({
      url:'https://tile.openstreetmap.org/',maximumLevel:19,
      credit:new Cesium.Credit('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',true)
    });
    const viewer=new Cesium.Viewer('globe',{
      baseLayer:new Cesium.ImageryLayer(osm),
      terrainProvider:new Cesium.EllipsoidTerrainProvider(),
      baseLayerPicker:false,geocoder:false,animation:false,timeline:false,
      homeButton:false,sceneModePicker:false,navigationHelpButton:true,
      fullscreenButton:false,infoBox:false,selectionIndicator:false,
      requestRenderMode:true,sceneMode:Cesium.SceneMode.SCENE3D
    });
    viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#233858');
    viewer.scene.globe.preloadAncestors=false;
    viewer.scene.globe.preloadSiblings=false;
    const position=Cesium.Cartesian3.fromDegrees(locationData.lon,locationData.lat);
    viewer.entities.add({position,point:{pixelSize:15,color:Cesium.Color.fromCssColorString('#a9b8ff'),outlineColor:Cesium.Color.WHITE,outlineWidth:3,disableDepthTestDistance:Number.POSITIVE_INFINITY},label:{text:'Approximate IP location',font:'14px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#162238'),pixelOffset:new Cesium.Cartesian2(0,-32),disableDepthTestDistance:Number.POSITIVE_INFINITY}});
    function recenter(){
      const offset=viewer.scene.mode===Cesium.SceneMode.SCENE3D?new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-50),120000):new Cesium.HeadingPitchRange(0,-Math.PI/2,120000);
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(position,0),{duration:1.2,offset});
    }
    document.getElementById('recenter').onclick=recenter;
    document.getElementById('world').onclick=()=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(locationData.lon,locationData.lat,22000000),duration:1.5});
    document.getElementById('flat').onclick=()=>{
      if(viewer.scene.mode===Cesium.SceneMode.SCENE3D)viewer.scene.morphTo2D(0.8);
      else viewer.scene.morphTo3D(0.8);
    };
    viewer.scene.renderError.addEventListener(()=>showError('The 3D renderer stopped. Try another browser or use the Google Maps buttons below.'));
    osm.errorEvent.addEventListener(()=>showError('Some map tiles could not load. Check your connection or use Google Maps below.'));
    viewer.camera.lookAt(position,new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-50),120000));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    statusBox.style.display='none';
    window.ipTrackerMapReady=true;
  }catch(error){showError('3D view is unavailable. Enable WebGL / graphics acceleration or use Google Maps below.');}
}
const script=document.createElement('script');
script.src=window.CESIUM_BASE_URL+'Cesium.js';
script.onload=boot;
script.onerror=()=>showError('Could not load the map library. Check your Internet connection or use Google Maps below.');
document.head.appendChild(script);
</script>
</body>
</html>
